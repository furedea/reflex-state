name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Draft release tag to resume (select this tag as the workflow ref too)
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "Set RELEASE_PLEASE_TOKEN so release PRs can trigger CI."
            exit 1
          fi

      - name: Create release PR or draft release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release_please_config.json
          manifest-file: .release_please_manifest.json

  release-artifacts:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}
    steps:
      - name: Validate release tag input
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v0.1.0-alpha.1."
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.TAG_NAME }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify draft and source commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare_release.mjs

      - name: Check npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);' "$npm_version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check source
        run: pnpm check

      - name: Build and pack once
        id: pack
        run: |
          pnpm build
          mkdir -p .release
          npm pack --ignore-scripts --json --pack-destination .release > .release/pack.json
          filename="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(".release/pack.json", "utf8"))[0].filename)')"
          echo "tarball=.release/$filename" >> "$GITHUB_OUTPUT"

      - name: Test the packaged extension and commands
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: pnpm package:check "$TARBALL"

      - name: Write checksum
        working-directory: .release
        run: sha256sum ./*.tgz > checksums.txt

      - name: Attest the tested tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Attach artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          [[ "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" == "true" ]]
          cp "$BUNDLE_PATH" .release/provenance.json
          # Replacement is allowed only while the release is still a draft.
          gh release upload "$TAG_NAME" "$TARBALL" .release/checksums.txt .release/provenance.json --clobber

      - name: Publish the same tarball to npm with provenance
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: node scripts/publish_package.mjs "$TARBALL"

      - name: Publish completed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" == "true" ]]
          gh release edit "$TAG_NAME" --draft=false
